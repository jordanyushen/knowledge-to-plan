/* Learning dashboard: the same local course state powers every view. */
.dashboard-link{width:100%;margin-top:23px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-weight:650;background:var(--paper)}
.dashboard-link[aria-current="page"]{background:var(--light);border-color:#a9bea3;color:var(--green)}
.dashboard-link+.lesson-list{margin-top:17px}
.study-tabs:empty{display:none}
.dashboard-hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:24px;align-items:center;padding:32px 34px;background:#244d3c;color:var(--paper);border-radius:22px;margin-bottom:24px}
.dashboard-hero::after{content:"";position:absolute;z-index:-1;right:-85px;top:-105px;width:370px;height:370px;border:1px solid #5a7b65;border-radius:50%;box-shadow:0 0 0 38px #ffffff04,0 0 0 77px #ffffff03;pointer-events:none}
.dashboard-hero .eyebrow{color:#c6d7ad;font-size:10px;letter-spacing:2.3px}
.dashboard-hero h2{font-size:30px;line-height:1.45;max-width:580px;margin:0 0 12px;color:var(--paper);overflow-wrap:anywhere}
.dashboard-hero p{font-size:13px;line-height:1.9;color:#d3dfd1;margin-bottom:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:23px}.hero-actions .muted{color:#d3dfd1;font-size:11px}
.dashboard-hero .primary{background:#e6eddb;color:#244d3c;border-color:#e6eddb}
.dashboard-hero .primary:hover{background:#f8f9ef}
.dashboard-hero .secondary{color:#eef3e6;border-color:#71907a}
.dashboard-hero .secondary:hover{background:#365d48}
.hero-progress{align-self:center;display:flex;flex-direction:column;padding:21px 0 21px 27px;border-left:1px solid #6e8c714f;font-size:12px;color:#d3dfd1;line-height:1.7}
.hero-progress strong{font-size:51px;line-height:1.2;letter-spacing:-2px;color:#f7f5de;font-weight:650;font-variant-numeric:tabular-nums;margin-bottom:10px}
.hero-progress progress{height:5px;margin:10px 0;background:#55745a}
.hero-progress progress::-webkit-progress-bar{background:#55745a}
.hero-progress progress::-webkit-progress-value{background:#d4e1b5}
.hero-progress progress::-moz-progress-bar{background:#d4e1b5}
.dashboard-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 25px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px 19px;min-width:0}
.stat-label{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 9px}
.stat-value{display:block;color:var(--navy);font-size:28px;line-height:1.35;font-weight:650;letter-spacing:-.9px;font-variant-numeric:tabular-nums;margin:0 0 6px;overflow-wrap:anywhere}
.stat-caption{font-size:10px;line-height:1.8;color:var(--muted);margin:0}
.dashboard-panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
.panel-heading{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 15px;margin-bottom:18px}
.panel-heading h3{font-size:17px;margin:0;letter-spacing:-.2px}
.panel-heading p{font-size:11px;color:var(--muted);margin:0}
.checkin-panel{margin:20px 0 25px}
.checkin-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:0 0 21px;font-size:12px;color:var(--muted)}
.checkin-summary strong{color:var(--green)}
.checkin-summary p{margin:0}
.checkin-summary button{font-size:12px}
.checkin-grid-scroll{display:flex;align-items:start;gap:12px;overflow-x:auto;overflow-y:hidden;padding:5px 5px 9px;scrollbar-width:thin}
.checkin-map{display:grid;grid-template-columns:repeat(13,24px);gap:5px;flex:none}
.checkin-week{display:grid;grid-template-rows:repeat(7,1fr);gap:5px}
.checkin-cell{display:block;appearance:none;padding:0;width:100%;aspect-ratio:1;max-height:30px;min-height:17px;border:1px solid #e1e5da;border-radius:4px;background:#eef0e7;font-size:0;line-height:0}
.checkin-cell.level-0{background:#eef0e7;border-color:#e1e5da}
.checkin-cell.level-1{background:#dce6c8;border-color:#c6d6b0}
.checkin-cell.level-2{background:#a8c48a;border-color:#96b47a}
.checkin-cell.level-3{background:#638d51;border-color:#547f44}
.checkin-cell.level-4{background:#315f3e;border-color:#254d31}
.checkin-cell.is-today{outline:2px solid #b28c43;outline-offset:1px}
.checkin-cell.is-future{opacity:.35;background:transparent;border-style:dashed}
.checkin-cell:focus-visible{outline:3px solid #a78236;outline-offset:2px}
.map-weekdays{display:grid;grid-template-rows:repeat(7,24px);gap:5px;flex:none;font-size:9px;line-height:1;color:var(--muted)}
.map-weekdays span{display:flex;align-items:center}
.map-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;justify-content:flex-end;font-size:10px;color:var(--muted);margin:12px 0 0}
.map-legend .checkin-cell{flex:none;display:inline-block;width:11px;min-height:11px;height:11px;border-radius:3px;aspect-ratio:auto}
.map-legend>span{display:inline-flex;align-items:center;gap:5px}.map-legend .map-range{margin-left:auto;font-variant-numeric:tabular-nums}
.map-note{font-size:11px;line-height:1.9;color:var(--muted);margin:15px 0 0;white-space:pre-wrap}
.dashboard-note{font-size:11px;line-height:1.9;color:var(--muted);margin:17px 0 0}
.day-detail{margin-top:18px;padding:18px 20px;border:1px solid #dce2d1;border-radius:12px;background:#f4f6ed}
.day-detail-date{font-size:10px;letter-spacing:.6px;color:var(--muted);margin:0 0 5px;font-variant-numeric:tabular-nums}
.day-detail-title{font-size:14px;line-height:1.7;color:var(--navy);margin:0 0 14px}
.day-detail-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.day-detail-stats>div{min-width:0;border-right:1px solid #dce2d1;padding-right:10px}
.day-detail-stats>div:last-child{border:0;padding-right:0}
.day-detail-stats strong{display:block;font-size:22px;line-height:1.35;letter-spacing:-.5px;font-weight:650;color:var(--green);font-variant-numeric:tabular-nums}
.day-detail-stats span{display:block;font-size:10px;line-height:1.7;color:var(--muted);margin-top:4px}
.day-detail-lessons{margin:14px 0 0;padding:13px 0 0 17px;border-top:1px solid #dce2d1;font-size:11px;line-height:1.85;color:var(--navy)}
.day-detail-lessons li+li{margin-top:4px}.day-detail-lessons:empty{display:none}
.day-lesson-link{padding:3px 0;border:0;background:transparent;color:var(--green);font-size:11px;line-height:1.8;text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.checkin-map .checkin-cell.is-selected{box-shadow:inset 0 0 0 2px #142d3b;border-color:#142d3b}
@media(min-width:1000px) and (max-width:1199px){main{padding-left:30px;padding-right:30px}.dashboard-stats{gap:9px}.stat-card{padding:15px 13px}.dashboard-hero{padding:28px;grid-template-columns:minmax(0,1fr) 125px}.hero-progress{padding-left:20px}.hero-progress strong{font-size:43px}}
@media(max-width:999px) and (min-width:801px){main{padding-left:24px;padding-right:24px}.dashboard-hero{grid-template-columns:1fr;padding:25px}.hero-progress{padding:0;border:0;display:block}.hero-progress strong{font-size:37px;margin-right:10px}.hero-progress progress{max-width:180px;display:block}.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-panel{padding:20px}.dashboard-hero h2{font-size:25px}}
@media(max-width:800px){.dashboard-hero{padding:27px;grid-template-columns:minmax(0,1fr) 125px;gap:18px}.dashboard-hero h2{font-size:27px}.hero-progress{padding-left:20px}.hero-progress strong{font-size:42px}.dashboard-stats{gap:10px}.stat-card{padding:15px}.stat-value{font-size:25px}.dashboard-panel{padding:20px}.checkin-panel{margin-top:16px}.dashboard-link{margin-top:17px}}
@media(max-width:580px){.dashboard-hero{grid-template-columns:minmax(0,1fr);padding:25px 22px;border-radius:17px;gap:20px}.dashboard-hero h2{font-size:25px}.dashboard-hero p{font-size:12px}.hero-progress{border-left:0;border-top:1px solid #6e8c714f;padding:17px 0 0;display:block}.hero-progress strong{font-size:35px;display:inline-block;margin:0 12px 0 0}.hero-progress progress{display:block;max-width:260px;margin-bottom:0}.hero-actions{margin-top:18px}.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px}.stat-value{font-size:26px}.stat-card{padding:16px}.dashboard-panel{padding:19px}.panel-heading{margin-bottom:15px}.checkin-summary{align-items:flex-start;gap:12px}.map-legend{justify-content:flex-start}.page-footer{margin-top:36px}}
@media print{.dashboard-hero{color:var(--navy);background:white;border:1px solid var(--line)}.dashboard-hero h2,.dashboard-hero p,.dashboard-hero .eyebrow,.hero-progress,.hero-progress strong{color:var(--navy)}.dashboard-hero::after,.hero-actions,.checkin-summary button{display:none}.dashboard-panel,.stat-card{break-inside:avoid}}

/* Motion is decorative: the final values and every control remain available. */
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.progress-track{display:block;width:100%;height:5px;margin:10px 0;background:#55745a;border-radius:12px;overflow:hidden}
.progress-fill{display:block;height:100%;background:#d4e1b5;border-radius:inherit;transform-origin:left center}
.checkin-panel{position:relative}
.checkin-burst{position:absolute;top:45px;right:76px;width:1px;height:1px;pointer-events:none;z-index:2}
.checkin-spark{position:absolute;left:0;top:0;width:5px;height:8px;border-radius:2px;background:#668d59;opacity:0;pointer-events:none}
.checkin-spark:nth-child(3n){background:#bd9b50}.checkin-spark:nth-child(3n + 1){background:#a3bd83}
.checkin-success{color:var(--green);border-color:#a9bea3;background:var(--light)}
@media(max-width:580px){.hero-progress .progress-track{max-width:260px;margin-bottom:0}.checkin-burst{top:40px;right:71px}}

@media(prefers-reduced-motion:no-preference){
  :root{--motion-ease:cubic-bezier(.22,1,.36,1)}
  button,.demo-banner a{transition:background-color .18s ease,color .18s ease,border-color .18s ease,box-shadow .22s ease,transform .22s var(--motion-ease)}
  .stat-card,.option{transition:border-color .2s ease,box-shadow .25s ease,transform .28s var(--motion-ease),background-color .18s ease}
  .primary:active:not(:disabled),.secondary:active:not(:disabled),.lesson-link:active:not(:disabled),.tool-button:active:not(:disabled){transform:translateY(1px) scale(.985)}
  .tab{position:relative;border-bottom-color:transparent}
  .tab::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--green);border-radius:3px;transform:scaleX(0);transform-origin:center;transition:transform .25s var(--motion-ease)}
  .tab[aria-current="step"]{border-bottom-color:transparent}.tab[aria-current="step"]::after{transform:scaleX(1)}
  #content.motion-enter > :is(.dashboard-hero,.card,.completion,.activity-list,.question-nav,.empty),
  #content.motion-enter > .dashboard-stats > .stat-card,
  #content.motion-enter > .checkin-panel{
    animation:ktp-rise-in .55s var(--motion-ease) backwards;
    animation-delay:min(calc(var(--motion-order,0)*55ms),220ms)
  }
  #content.motion-enter .checkin-map .checkin-cell:not(.is-future){
    animation:ktp-cell-in .38s var(--motion-ease) backwards;
    animation-delay:min(calc(var(--motion-order,0)*12ms + 110ms),290ms)
  }
  .motion-progress .progress-fill{animation:ktp-progress-fill .9s var(--motion-ease) both}
  .feedback,.notice:not([hidden]),.completion{animation:ktp-feedback-in .32s var(--motion-ease) backwards}
  .checkin-cell.just-checked{animation:ktp-checkin-glow .75s var(--motion-ease) both!important}
  .checkin-success{animation:ktp-button-settle .4s var(--motion-ease) backwards}
  .checkin-burst .checkin-spark{animation:ktp-checkin-spark .7s var(--motion-ease) both;animation-delay:calc(var(--spark-order,0)*12ms)}
  @media(hover:hover) and (pointer:fine){

}

/* Scientific content stays local: native MathML and self-contained SVG images. */
.formula-block{margin:23px 0;padding:20px;border:1px solid #d4decc;border-radius:12px;background:#f2f5eb;min-width:0}
.formula-title,.diagram-title{font-size:14px;line-height:1.7;margin:0 0 13px;color:var(--green)}
.formula-display{overflow-x:auto;overflow-y:hidden;padding:12px 5px;margin:0 0 13px;max-width:100%;text-align:center;scrollbar-width:thin}
.formula-display math{font-size:1.4rem;min-width:max-content;margin:0 auto;color:var(--navy)}
.formula-expression{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.45rem;line-height:1.8;white-space:pre;overflow-wrap:normal;color:var(--navy)}
.formula-explanation,.formula-conditions{font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0}
.formula-conditions{padding-top:13px;border-top:1px solid #d4decc}
.formula-conditions strong{display:block;color:var(--green);font-size:11px;margin-bottom:3px}
.formula-warning{color:var(--red);font-size:11px;line-height:1.8;margin:0 0 10px;overflow-wrap:anywhere}
.formula-table-scroll{overflow-x:auto;max-width:100%;margin-top:16px;scrollbar-width:thin}
.formula-variables{width:100%;border-collapse:collapse;font-size:12px;line-height:1.8;text-align:left}
.formula-variables caption{font-size:11px;color:var(--muted);text-align:left;padding:0 0 7px}
.formula-variables th,.formula-variables td{padding:8px 12px;border-bottom:1px solid #dce2d2;vertical-align:top;overflow-wrap:anywhere}
.formula-variables th{font-size:10px;color:var(--muted);font-weight:650}
.formula-variables th:first-child{white-space:nowrap}
.formula-variables td:first-child{font-family:"Cambria Math","Times New Roman",serif;font-size:15px;white-space:nowrap}
.formula-variables td:last-child{white-space:nowrap}
.lesson-diagram{margin:24px 0 0;min-width:0;padding:18px;border:1px solid var(--line);border-radius:12px;background:#fffefa}
.diagram-scroll{max-width:100%;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.diagram-image{display:block;width:100%;height:auto;min-width:480px;max-width:none;margin:auto}
.diagram-hint{display:none;margin:8px 0 0;font-size:10px;line-height:1.7;color:var(--muted)}
.lesson-diagram figcaption{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:580px){.formula-block{padding:17px 14px}.formula-display math{font-size:1.3rem}.formula-expression{font-size:1.3rem}.formula-variables th,.formula-variables td{padding:7px 8px}.lesson-diagram{padding:14px}.diagram-image{min-width:480px}.diagram-hint{display:block}}
@media print{.formula-block,.lesson-diagram{break-inside:avoid;background:white;border-color:#aab5a5}.formula-display,.formula-table-scroll,.diagram-scroll{overflow:visible}.diagram-image{min-width:0;max-width:100%}.formula-display math,.formula-expression{color:black}}

  <script>window.COURSE={"schema_version":1,"course":{"id":"stem-ohms-law-expression-example","title":"公式与示意图 · 欧姆定律教学示例","goal":"在明确条件与参考方向的直流电路中，读懂电路图并用欧姆定律求电流。","background":"认识四则运算，初次学习电压、电流与电阻。此内容用于验证公式排版和示意图，不是用户的正式学习计划。","days":1,"daily_minutes":20,"timezone":"Asia/Hong_Kong"},"sources":[{"id":"openstax-ohm","title":"OpenStax · University Physics Volume 2 · 9.4 Ohm’s Law","url":"https://openstax.org/books/university-physics-volume-2/pages/9-4-ohms-law","locator":"Description of Ohm’s Law：欧姆元件的电流与两端电压成正比；本例用 U 表示原文中的电压 V。"},{"id":"original-circuit","title":"原创教学示意图与给定数值","locator":"本示例原创绘制的理想直流电源与单个欧姆电阻闭合回路；给定电源12 V、电阻6 Ω，图不按比例。"}],"lessons":[{"id":"stem-ohm-01","day":1,"title":"先读图与条件，再代入公式","objectives":["说清电压 U、电流 I、电阻 R 的含义和单位。","将图中的电流参考方向、正负极性与 I = U/R 对应起来。","在本例条件下算出2 A，并说明该公式不能直接代表所有元件的特性。"],"activities":[{"kind":"read","minutes":6},{"kind":"practice","minutes":8},{"kind":"notes","minutes":2},{"kind":"quiz","minutes":4}],"sections":[{"title":"公式中的量与条件","body":"电压描述两点间的电势差，单位为伏特 V；电流表示电荷流动的速率，单位为安培 A；电阻的单位为欧姆 Ω。\n本例用 U 表示电阻两端电压，OpenStax 原文用 V 表示同一个物理量。写公式前先说明符号，不能将代表物理量的符号与单位混为一谈。\n对于温度保持稳定、满足欧姆特性的电阻，电流与其两端电压成正比。本例从 U = IR 求出 I = U/R，要求 R > 0；它不是对所有器件都成立的普遍线性特性。","formulas":[{"title":"由电压和电阻求电流","expression":"I = U/R","mathml":"\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>","explanation":"将 U = IR 的两边除以非零电阻 R。分式的整个分母是 R；单位关系为 V/Ω = A。计算中的 U 是电阻两端电压，I 的参考方向采用下图所示的常规电流方向。","variables":[{"symbol":"I","meaning":"按图示参考方向流过电阻的电流","unit":"A（安培）"},{"symbol":"U","meaning":"电阻两端沿所约定极性取值的电压","unit":"V（伏特）"},{"symbol":"R","meaning":"本例欧姆电阻的电阻值","unit":"Ω（欧姆）"}],"conditions":"本例为理想直流电源、可忽略电阻的导线和温度稳定的欧姆电阻组成的稳态回路；R > 0。对非欧姆元件不能直接假定 U 与 I 始终满足同一个恒定 R 的线性关系。","source_ids":["openstax-ohm"]}],"example":"已知电阻两端电压 U = 12 V、电阻 R = 6 Ω，且满足上述条件。代入：I = (12 V)/(6 Ω) = 2 A。数量与单位都相除，得到安培；结果为正，表示实际常规电流方向与图中参考箭头一致。"},{"title":"把公式对应到闭合回路","body":"电路中只有理想直流电源、导线和一个电阻。导线压降按本例假设忽略，因此电阻两端电压为12 V。\n图中电源的上端标为正、下端标为负；常规电流从电源正端沿上方导线向右，经电阻向下，再沿下方导线返回负端。这里讨论常规电流方向，不把它当作金属中电子运动方向。\n图上的 U、I、R 与公式变量表使用相同符号；箭头、连接和正负号都是推理条件，不能用仅有装饰作用的图片替代。","diagrams":[{"title":"理想直流电源与单个欧姆电阻","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 260\" width=\"720\" height=\"260\">\u003ctitle>12伏理想直流电源连接6欧姆电阻的闭合回路\u003c/title>\u003cdesc>电源正端在上、负端在下。电流参考箭头沿上方导线向右，经过电阻并回到电源负端，电流为2安培。\u003c/desc>\u003cdefs>\u003cmarker id=\"current-arrow\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath d=\"M0 0 L8 4 L0 8 Z\" fill=\"#32674f\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1\" y=\"1\" width=\"718\" height=\"258\" rx=\"16\" fill=\"#f7f8f2\" stroke=\"#dce2d1\"/>\u003cpath d=\"M130 102 V55 H540 V98 M540 182 V225 H130 V178\" fill=\"none\" stroke=\"#142d3b\" stroke-width=\"3\"/>\u003ccircle cx=\"130\" cy=\"140\" r=\"38\" fill=\"#fffefa\" stroke=\"#142d3b\" stroke-width=\"3\"/>\u003crect x=\"518\" y=\"98\" width=\"44\" height=\"84\" fill=\"#e8eee4\" stroke=\"#142d3b\" stroke-width=\"3\"/>\u003cpath d=\"M280 55 H366\" fill=\"none\" stroke=\"#32674f\" stroke-width=\"3\" marker-end=\"url(#current-arrow)\"/>\u003ctext x=\"130\" y=\"130\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"24\" fill=\"#142d3b\">+\u003c/text>\u003ctext x=\"130\" y=\"163\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"26\" fill=\"#142d3b\">−\u003c/text>\u003ctext x=\"324\" y=\"36\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"21\" fill=\"#32674f\">I = 2 A →\u003c/text>\u003ctext x=\"582\" y=\"118\" font-family=\"sans-serif\" font-size=\"20\" fill=\"#142d3b\">U = 12 V\u003c/text>\u003ctext x=\"582\" y=\"155\" font-family=\"sans-serif\" font-size=\"20\" fill=\"#142d3b\">R = 6 Ω\u003c/text>\u003ctext x=\"130\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#6c797b\">理想12 V直流电源\u003c/text>\u003c/svg>","alt":"闭合回路：左侧理想直流电源上端正、下端负，右侧为6 Ω电阻；常规电流沿上方导线向右流过电阻，I = 2 A，电阻两端电压U = 12 V。","caption":"按常规电流方向标箭头。电源正端连接电阻上端，负端连接下端；导线压降忽略，所以电阻两端U = 12 V。图不按比例，12 V与6 Ω是本例给定值，2 A由公式计算。","source_ids":["original-circuit"]}]}],"practice":{"given":"理想直流电源12 V；欧姆电阻6 Ω；稳态、温度稳定；导线电阻忽略。电流参考方向与图中箭头一致。","task":"先写出求I的表达式，再代入带单位的数值；最后检查正负方向和单位。","expected_output":"I = U/R = (12 V)/(6 Ω) = 2 A；V/Ω = A；正号表示与图示参考方向一致。再写一句条件限制，说明不能直接把恒定R的线性模型用于所有器件。"},"takeaways":["公式必须连同变量含义、单位、适用条件和参考方向一起读。","本例I = (12 V)/(6 Ω) = 2 A；排成分式后，分子和分母的范围明确。","示意图中的连接、极性和电流方向应与文字及公式一致。"],"questions":[{"id":"q-expression","prompt":"在R > 0且满足本例条件时，由U = IR求电流I，哪一种表达正确？","options":["I = U/R","I = UR","I = R/U"],"correct_index":0,"explanations":["两边同除以非零的R，得到I = U/R；单位V/Ω为A。","乘以R不能解出原式中的I，单位V·Ω也不是电流单位。","把分子和分母颠倒了；R/U的单位Ω/V不是A。"]},{"id":"q-calculation","prompt":"图示回路给定U = 12 V、R = 6 Ω，按图示参考方向求得的电流是多少？","options":["72 A","2 A","0.5 A"],"correct_index":1,"explanations":["72来自把12与6相乘；本题应使用电压除以电阻。","I = (12 V)/(6 Ω) = 2 A，且正号与图示常规电流方向一致。","0.5来自把6除以12，换算方向颠倒，也忽略了单位对应。"]},{"id":"q-condition","prompt":"下面哪句话准确说明了本例公式的适用条件？","options":["所有元件都能用同一个恒定R描述其全部电压、电流关系","图中的箭头就是金属中电子的运动方向","本例采用温度稳定的欧姆电阻和理想直流稳态模型，R > 0"],"correct_index":2,"explanations":["非欧姆元件不一定呈电流与电压成正比的恒定R线性关系。","本图使用常规电流方向；不能将其直接等同于金属中电子的运动方向。","这些条件说明了为何能使用本课的恒定电阻模型，以及除以R为何合法。"]}],"source_ids":["openstax-ohm","original-circuit"]}]};</script>
  <script>(() => {
  'use strict';
  const data = window.COURSE, course = data.course, lessons = data.lessons;
  const $ = id => document.getElementById(id);
  const make = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text !== undefined) el.textContent = text; return el; };
  const button = (text, cls, action) => { const el = make('button', cls, text); el.type = 'button'; el.addEventListener('click', action); return el; };
  const key = 'knowledge-to-plan:v1:' + course.id;
  const qkey = (l, q) => 'q:' + JSON.stringify([l.id, q.id]);
  const nkey = l => 'l:' + l.id;
  // A canonical content fingerprint changes whenever any part of a question changes.
  const fingerprint = q => JSON.stringify([q.prompt, q.options, q.correct_index, q.explanations]);
  const questionMap = new Map(lessons.flatMap(l => l.questions.map(q => [qkey(l, q), { l, q }])));
  let state = { schema_version: 1, course_id: course.id, answers: {}, notes: {}, checkins: {}, lastDay: lessons[0]?.day, view: 'dashboard', cursors: {} };
  let lesson, view = 'dashboard', storageAvailable = true, dashboardDate;
  let lastRenderedView, enteringView = false, lastProgress, selectedDate, pendingCelebration = false;
  const motionAllowed = () => !window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
  const dateFormat = new Intl.DateTimeFormat('en-US', { timeZone: course.timezone, year: 'numeric', month: '2-digit', day: '2-digit' });
  function dateKey(at = Date.now()) {
    const parts = dateFormat.formatToParts(new Date(at));
    const part = name => parts.find(p => p.type === name).value;
    return `${part('year')}-${part('month')}-${part('day')}`;
  }
  const shiftDate = (day, offset) => new Date(Date.parse(day + 'T12:00:00Z') + offset * 86400000).toISOString().slice(0, 10);
  function markActivity(at, kind = 'study') {
    if (!Number.isFinite(at) || at <= 0 || at > Date.now()) return;
    const day = dateKey(at), previous = state.checkins[day];
    state.checkins[day] = { at: Math.max(previous?.at || 0, at), kind: previous?.kind === 'study' || kind === 'study' ? 'study' : 'manual' };
  }
  const announce = message => { $('notice').textContent = message; $('notice').hidden = false; };
  function storageWarning() { storageAvailable = false; $('storage-warning').textContent = '当前浏览器无法持久保存学习记录。本次学习仍可继续，请在离开前导出记录；重新打开后可导入恢复。'; $('storage-warning').hidden = false; }
  function save() { if (storageAvailable) { try { localStorage.setItem(key, JSON.stringify(state)); } catch (_) { storageWarning(); } } }
  const validTime = x => Number.isFinite(x) && x >= 0 && x <= Date.now() + 86400000;
  function sanitizeAnswer(raw, q) {
    if (!raw || raw.fingerprint !== fingerprint(q)) return null;
    const validSelection = n => Number.isInteger(n) && n >= 0 && n < q.options.length;
    const attempts = Array.isArray(raw.attempts) ? raw.attempts.filter(a => a && validSelection(a.selected) && validTime(a.at)).map(a => ({ selected: a.selected, at: a.at })) : [];
    const selected = validSelection(raw.selected) ? raw.selected : null;
    const updated_at = validTime(raw.updated_at) ? raw.updated_at : 0;
    const submitted = raw.submitted === true && selected !== null;
    if (submitted && !attempts.some(a => a.at === updated_at && a.selected === selected)) attempts.push({ selected, at: updated_at });
    return { fingerprint: fingerprint(q), selected, submitted, updated_at, attempts };
  }
  function mergePayload(payload, restoring = false) {
    if (!payload || payload.schema_version !== 1 || payload.course_id !== course.id) throw new Error('记录不属于当前课程，或文件版本不受支持。');
    let accepted = 0, skipped = 0;
    if (payload.answers && typeof payload.answers === 'object') for (const [id, raw] of Object.entries(payload.answers)) {
      const item = questionMap.get(id), incoming = item && sanitizeAnswer(raw, item.q);
      if (!incoming) { skipped++; continue; }
      const previous = state.answers[id];
      if (previous) {
        const winner = previous.updated_at > incoming.updated_at ? previous : incoming;
        const attempts = [...previous.attempts, ...incoming.attempts];
        const unique = new Map(attempts.map(a => [a.at + ':' + a.selected, a]));
        state.answers[id] = { ...winner, attempts: [...unique.values()].sort((a, b) => a.at - b.at) };
      } else state.answers[id] = incoming;
      accepted++;
    }
    for (const l of lessons) {
      const id = nkey(l), note = payload.notes?.[id];
      if (note && typeof note.text === 'string' && validTime(note.updated_at) && (!state.notes[id] || note.updated_at >= state.notes[id].updated_at)) state.notes[id] = { text: note.text, updated_at: note.updated_at };
      const cursor = payload.cursors?.[id];
      if (restoring && Number.isInteger(cursor) && cursor >= 0 && cursor < l.questions.length) state.cursors[id] = cursor;
    }
    // v1 backups may predate check-ins. Recover only activity with real timestamps.
    for (const raw of Object.values(state.answers)) for (const attempt of raw.attempts) markActivity(attempt.at);

    const el = make('section', 'formula-block');
    if (formula.title) el.append(make('h4', 'formula-title', formula.title));
    const expression = typeof formula.expression === 'string' ? formula.expression : '公式表达式缺失，请先补全。';
    const display = make('div', 'formula-display');
    if (formula.mathml) {
      const result = parseMathML(formula.mathml, expression);
      if (result.node) display.append(result.node);
      else {
        display.append(make('div', 'formula-expression', expression));
        const warning = make('p', 'formula-warning', result.warning); warning.setAttribute('role', 'status'); el.append(warning);
      }
    } else display.append(make('div', 'formula-expression', expression));
    el.append(display);
    if (formula.explanation) el.append(make('p', 'formula-explanation', formula.explanation));
    if (Array.isArray(formula.variables) && formula.variables.length) {
      const wrap = make('div', 'formula-table-scroll'), table = make('table', 'formula-variables');
      const caption = make('caption', '', '符号与单位'), head = make('thead'), row = make('tr');
      for (const label of ['符号', '含义', '单位']) { const th = make('th', '', label); th.setAttribute('scope', 'col'); row.append(th); }
      head.append(row); table.append(caption, head);
      const body = make('tbody');
      for (const variable of formula.variables) {
        if (!variable || typeof variable !== 'object') continue;
        const tr = make('tr');
        for (const value of [variable.symbol, variable.meaning, variable.unit]) tr.append(make('td', '', typeof value === 'string' ? value : '待补充'));
        body.append(tr);
      }
      table.append(body); wrap.append(table); el.append(wrap);
    }
    if (formula.conditions) { const conditions = make('p', 'formula-conditions'); conditions.append(make('strong', '', '适用条件'), make('span', '', formula.conditions)); el.append(conditions); }
    return el;
  }
  function renderDiagram(diagram) {
    diagram = diagram && typeof diagram === 'object' ? diagram : {};
    const figure = make('figure', 'lesson-diagram');
    if (diagram.title) figure.append(make('h4', 'diagram-title', diagram.title));
    if (typeof diagram.svg === 'string' && diagram.svg.trim()) {
      const scroll = make('div', 'diagram-scroll'), img = make('img', 'diagram-image');
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(diagram.svg);
      img.alt = typeof diagram.alt === 'string' ? diagram.alt : '示意图缺少替代文字，请核对。';
      scroll.append(img); figure.append(scroll, make('p', 'diagram-hint', '宽图可横向滑动，查看完整连接与标注。'));
    } else figure.append(make('p', 'formula-warning', '示意图内容缺失，请先补全。'));
    if (diagram.caption) figure.append(make('figcaption', '', diagram.caption));
    return figure;
  }
  function practiceText(value) { if (typeof value === 'string') return value; if (Array.isArray(value)) return value.map(practiceText).join('\n'); if (value && typeof value === 'object') return Object.values(value).map(practiceText).join('\n'); return value == null ? '' : String(value); }
  function renderPractice() {
    const content = $('content'); if (lesson.practice) content.append(card('把知识用起来', practiceText(lesson.practice)));
    else content.append(card('用自己的话解释', '合上阅读内容，用自己的话写下今天学到的要点，再举一个你熟悉的例子。'));
    const el = card(), label = make('label', 'notes-label', '我的学习笔记'); label.htmlFor = 'lesson-notes';
    const notes = make('textarea'); notes.id = 'lesson-notes'; notes.placeholder = '记录你的理解、练习答案，以及还想弄清的问题……'; notes.value = state.notes[nkey(lesson)]?.text || '';
    const status = make('p', 'save-status', storageAvailable ? '输入后自动保存在当前浏览器' : '暂存于本次页面，请导出备份'); status.setAttribute('role', 'status');
    notes.addEventListener('input', () => { const now = Date.now(); state.notes[nkey(lesson)] = { text: notes.value, updated_at: now }; if (notes.value.trim()) markActivity(now); save(); status.textContent = storageAvailable ? '已自动保存' : '已暂存，请导出备份'; });
    el.append(label, notes, status); content.append(el);
    const actions = make('div', 'actions'); actions.append(button('← 返回阅读', 'secondary', () => changeTab('learn')), button('进入当日测验 →', 'primary', () => changeTab('quiz'))); content.append(actions);
  }
  function renderQuiz() {
    const content = $('content'), questions = lesson.questions, current = Math.min(state.cursors[nkey(lesson)] || 0, Math.max(questions.length - 1, 0));
    content.append(make('p', 'muted', '每道题答对后，本课才会通过。答错时可以查看解析，再试一次。'));
    if (!questions.length) { content.append(card('本课缺少测验', '暂不记录通过，请先补齐本课知识检查。')); return; }
    const nav = make('nav', 'question-nav'); nav.setAttribute('aria-label', '测验题目');
    questions.forEach((q, i) => { const a = record(lesson, q), b = button(String(i + 1), correct(lesson, q) ? 'correct' : a?.submitted ? 'wrong' : '', () => { state.cursors[nkey(lesson)] = i; save(); render(); }); if (i === current) b.setAttribute('aria-current', 'true'); b.setAttribute('aria-label', `第 ${i + 1} 题，${correct(lesson, q) ? '已答对' : a?.submitted ? '待重试' : '未完成'}`); nav.append(b); }); content.append(nav);
    const q = questions[current], a = record(lesson, q), el = card(); el.append(make('p', 'quiz-counter', `第 ${current + 1} / ${questions.length} 题 · 已答对 ${questions.filter(item => correct(lesson, item)).length} 题`));
    const fieldset = make('fieldset'), legend = make('legend', '', q.prompt), options = make('div', 'options'); fieldset.append(legend, options);
    q.options.forEach((text, i) => { const label = make('label', 'option'), input = make('input'); input.type = 'radio'; input.name = 'current-question'; input.id = 'answer-option-' + i; input.value = String(i); input.checked = a?.selected === i; input.disabled = !!a?.submitted; label.htmlFor = input.id;
      input.addEventListener('change', () => { updateAnswer(q, i, false); submit.disabled = false; }); label.append(input, make('span', '', text)); options.append(label);
    }); el.append(fieldset);
    if (a?.submitted) {
      const isCorrect = correct(lesson, q), feedback = make('div', 'feedback' + (isCorrect ? '' : ' incorrect')); feedback.setAttribute('role', 'status'); feedback.tabIndex = -1;
      feedback.append(make('strong', '', isCorrect ? '答对了，理解又深了一步。' : '这次还没有答对，看看每个选项的原因。'));
      q.options.forEach((option, i) => feedback.append(make('p', 'explanation-item', `${i === q.correct_index ? '✓ 正确选项' : '○ 其他选项'}${i === a.selected ? ' · 你的选择' : ''}\n${option}\n${q.explanations[i]}`)));
      el.append(feedback);
    }
    const actions = make('div', 'actions'), submit = button('提交答案', 'primary', () => { const selected = record(lesson, q)?.selected; if (!Number.isInteger(selected)) return; updateAnswer(q, selected, true); render(); $('content').querySelector('.feedback')?.focus(); });
    submit.disabled = !Number.isInteger(a?.selected); if (!a?.submitted) actions.append(submit);
    else if (!correct(lesson, q)) actions.append(button('再试一次', 'primary', () => { updateAnswer(q, null, false); render(); $('answer-option-0')?.focus(); }));
    if (current > 0) actions.append(button('上一题', 'secondary', () => { state.cursors[nkey(lesson)] = current - 1; save(); render(); }));
    if (current + 1 < questions.length) actions.append(button('下一题 →', 'secondary', () => { state.cursors[nkey(lesson)] = current + 1; save(); render(); }));
    el.append(actions); content.append(el); appendCompletion();
  }
  function appendCompletion() {
    if (!complete(lesson)) return;
    const el = make('div', 'completion'); el.setAttribute('role', 'status'); el.append(make('h3', '', '✓ 本课已通过'), make('p', '', '已完成本课知识检查，进度和错题历史已记录。实际能力仍需通过练习、项目或口述验证。'));
    const next = lessons[lessons.indexOf(lesson) + 1]; if (next) el.append(button('继续下一课 →', 'primary', () => openLesson(next))); else el.append(make('p', '', lessons.every(complete) ? '所有课程的知识检查已通过。可以导出记录，再核对练习与项目成果。' : '这是最后一课。你也可以回到目录，继续完成之前的知识检查。'));
    $('content').append(el);
  }
  function renderWrong() {
    $('lesson-heading').append(make('p', 'lesson-kicker', 'REVISIT & UNDERSTAND'), make('h2', '', '错题回顾'), make('p', 'lesson-goal', '答对后仍保留曾经的误选，方便回看理解是怎样建立起来的。'));
    const items = [...questionMap.values()].filter(({ l, q }) => wrongHistory(l, q).length);
    if (!items.length) $('content').append(make('p', 'empty', '还没有错题。完成每课测验后，你的复习线索会出现在这里。'));
    for (const { l, q } of items) {
      const history = wrongHistory(l, q), resolved = correct(l, q), el = card(), heading = make('div', 'history-title'); heading.append(make('h3', '', q.prompt), make('span', 'badge', resolved ? '已订正 · 历史保留' : '待订正')); el.append(heading, make('p', 'history-meta', `第 ${l.day} 天 · ${l.title} · 曾误选 ${history.length} 次`));
      for (const choice of [...new Set(history.map(a => a.selected))]) el.append(make('p', 'explanation-item', `曾选：${q.options[choice]}\n${q.explanations[choice]}`));
      const actions = make('div', 'actions'); actions.append(button(resolved ? '回看这道题 →' : '前往重试 →', 'secondary', () => openLesson(l, 'quiz', l.questions.indexOf(q)))); el.append(actions); $('content').append(el);
    }
    const actions = make('div', 'actions'); actions.append(button('返回当前课程', 'primary', () => openLesson(lesson))); $('content').append(actions);
  }
  $('menu-toggle').addEventListener('click', () => { const open = $('sidebar').classList.toggle('open'); $('menu-toggle').setAttribute('aria-expanded', String(open)); });
  $('dashboard-link').addEventListener('click', () => openDashboard());
  $('wrong-book').addEventListener('click', () => { view = 'wrong'; state.view = view; save(); render(); $('sidebar').classList.remove('open'); $('menu-toggle').setAttribute('aria-expanded', 'false'); $('main').focus(); });
  $('export-progress').addEventListener('click', () => { const blob = new Blob([JSON.stringify({ ...state, exported_at: new Date().toISOString() }, null, 2)], { type: 'application/json' }), url = URL.createObjectURL(blob), a = make('a'); a.href = url; a.download = 'KnowledgeToPlan-' + String(course.id).replace(/[^\p{L}\p{N}_-]/gu, '_') + '-progress.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); announce('学习记录已导出，包含进度、错题历史和笔记。'); });
  $('import-progress').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', async event => { const file = event.target.files[0]; if (!file) return; try { if (file.size > 10 * 1024 * 1024) throw new Error('记录文件过大，请选择小于 10 MB 的文件。'); const result = mergePayload(JSON.parse(await file.text())); save(); render(); announce(`导入完成，合并了 ${result.accepted} 道题的记录。${result.skipped ? `另有 ${result.skipped} 条记录因题目已变更或格式无效而跳过。` : ''}笔记已按更新时间合并。`); } catch (error) { announce('无法导入：' + (error instanceof SyntaxError ? '文件不是有效的 JSON 记录。' : error.message)); } event.target.value = ''; });
  $('course-title').textContent = course.title; document.title = course.title + ' · KnowledgeToPlan';
  $('course-meta').textContent = `${course.days} 天 · 每天 ${course.daily_minutes} 分钟${course.start_date ? ' · ' + course.start_date + ' 开始' : ''}${course.study_time ? ' · ' + course.study_time + ' ' + course.timezone : ''}`;
  const dayFromHash = () => { const match = /^#day-(\d+)$/.exec(location.hash); return match && lessons.find(l => l.day === Number(match[1])); };
  const refreshCalendar = () => { if (view === 'dashboard' && dashboardDate !== dateKey()) render(); };
  window.addEventListener('focus', refreshCalendar);
  document.addEventListener?.('visibilitychange', refreshCalendar);
  if (typeof window.setInterval === 'function') window.setInterval(refreshCalendar, 30000);
  window.addEventListener('hashchange', () => { const target = dayFromHash(); if (target) openLesson(target); else if (location.hash === '#dashboard' || !location.hash) openDashboard(); });
  lesson = dayFromHash() || lessons.find(l => l.day === state.lastDay) || lessons[0];
  if (dayFromHash()) openLesson(lesson, dayFromHash().day === state.lastDay && ['learn', 'practice', 'quiz'].includes(state.view) ? state.view : 'learn', undefined, false);
  else openDashboard(false);
})();
</script>
</body>
